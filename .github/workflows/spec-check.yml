name: Specification contracts
on:
  push:
    paths: ["contracts/**", "planning/**", "tools/spec/**", "docs/TZ_DEVELOPMENT.txt", "coordination/STATUS.json", ".github/workflows/spec-check.yml"]
  pull_request:
    paths: ["contracts/**", "planning/**", "tools/spec/**", "docs/TZ_DEVELOPMENT.txt", "coordination/STATUS.json", ".github/workflows/spec-check.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/spec/requirements.txt
      - run: python tools/spec/validate.py
