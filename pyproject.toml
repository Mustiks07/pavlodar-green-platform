[project]
name = "pavlodar-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "geoalchemy2>=0.17,<1",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "celery[redis]>=5.5,<6",
  "authlib>=1.6,<2",
  "httpx>=0.28,<1",
  "cryptography>=45",
  "jsonschema==4.26.0",
  "defusedxml==0.7.1",
  "pyshp>=2.3.1,<3",
  "pmtiles==3.8.1",
  "ortools>=9.14,<10",
  "reportlab>=4.4,<5",
  "xlsxwriter>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "openapi-spec-validator==0.9.0",
  "datamodel-code-generator>=0.33,<1",
  "ruff>=0.11,<1",
  "pip-audit>=2.9,<3",
  "pypdf>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated PostgreSQL/PostGIS test database"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["packages/domain/generated.py", "tools/spec/build_contracts.py", "tools/spec/build_planning.py", "tools/spec/build_pdf.py", "tools/spec/validate.py"]
